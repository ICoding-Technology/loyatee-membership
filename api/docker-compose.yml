services:
  arangodb:
    image: arangodb:3.12
    container_name: loyatee-arangodb
    restart: unless-stopped
    environment:
      ARANGO_ROOT_PASSWORD: ${ARANGO_PASSWORD:-rootpass}
    ports:
      - "8529:8529"
    volumes:
      - arango_data:/var/lib/arangodb3
      - arango_apps:/var/lib/arangodb3-apps
    healthcheck:
      test:
        [
          "CMD",
          "arangosh",
          "--server.endpoint",
          "tcp://127.0.0.1:8529",
          "--server.password",
          "${ARANGO_PASSWORD:-rootpass}",
          "--javascript.execute-string",
          "db._version();",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build: .
    container_name: loyatee-api
    restart: unless-stopped
    depends_on:
      arangodb:
        condition: service_healthy
    environment:
      FLASK_ENV: ${FLASK_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      ARANGO_URL: http://arangodb:8529
      ARANGO_DB: ${ARANGO_DB:-loyatee}
      ARANGO_USER: ${ARANGO_USER:-root}
      ARANGO_PASSWORD: ${ARANGO_PASSWORD:-rootpass}
    ports:
      - "5001:5000"

volumes:
  arango_data:
  arango_apps:
